  migration: identity_0005

- table: groups
  path: [constraints, uq_groups__slug]
  reason: >-
    Groups are platform-level since identity_0005 (design 5.3, DECISIONS B-928): a SHI-wide group exists once and reaches a client only through role bindings stored in that client; a slug names one SHI-wide group.
  migration: identity_0005

- table: groups
  path: [indexes, uq_groups__slug]
  reason: >-
    Groups are platform-level since identity_0005 (design 5.3, DECISIONS B-928): a SHI-wide group exists once and reaches a client only through role bindings stored in that client; index of uq_groups__slug.
  migration: identity_0005

- table: groups
  path: [indexes, uq_groups__idp_external]
  reason: >-
    Groups are platform-level since identity_0005 (design 5.3, DECISIONS B-928): a SHI-wide group exists once and reaches a client only through role bindings stored in that client; an IdP-mapped group is unique per (IdP, external name) platform-wide.
  migration: identity_0005

- table: groups
  path: [policies, tenant_isolation]
  reason: >-
    Groups are platform-level since identity_0005 (design 5.3, DECISIONS B-928): a SHI-wide group exists once and reaches a client only through role bindings stored in that client; no tenant_id to key on. Replaced by platform_admin_all and member_read (B-928).
  migration: identity_0005

- table: groups
  path: [policies, platform_admin_all]
  reason: >-
    Only the platform administrator creates, renames, disables or maps platform groups (design 5.3, B-928); a client context writes and reads no group row (reviewed REVIEWED_EXPRESSIONS entry).
  migration: identity_0005

- table: groups
  path: [policies, member_read]
  reason: >-
    A staff member reads the groups they belong to, only with no client context, so code running inside a client never learns the names of groups bound elsewhere (B-928; reviewed REVIEWED_EXPRESSIONS entry). A client sees id and name of its bound groups only, through shifde_bound_groups().
  migration: identity_0005

- table: groups
  path: [triggers, trg_groups_idp_scope]
  reason: >-
    A group's idp_config_id names an installation IdP only (identity part 1 carry_forward: constraints ignore RLS, so a group could name a client's IdP and let that client's IdP sync SHI staff groups; B-931).
  migration: identity_0005

- table: group_members
  path: [columns, tenant_id]
  reason: >-
    Groups are platform-level since identity_0005 (design 5.3, DECISIONS B-928): a SHI-wide group exists once and reaches a client only through role bindings stored in that client; membership of a staff member in a SHI-wide group is not client data.
  migration: identity_0005

- table: group_members
  path: [constraints, fk_group_members__group, definition]
  reason: >-
    Groups are platform-level since identity_0005 (design 5.3, DECISIONS B-928): a SHI-wide group exists once and reaches a client only through role bindings stored in that client; the key is group_id -> groups (id).
  migration: identity_0005

- table: group_members
  path: [constraints, fk_group_members__user]
  reason: >-
    Members are people of the platform staff directory (users); replaces the deferred client-keyed (tenant_id, user_id) -> memberships key (B-905), which is dropped for good: a staff member need not be a member of any client to be in a group (B-928).
  migration: identity_0005

- table: group_members
  path: [indexes, ix_group_members__user]
  reason: >-
    Groups are platform-level since identity_0005 (design 5.3, DECISIONS B-928): a SHI-wide group exists once and reaches a client only through role bindings stored in that client; index by person only.
  migration: identity_0005

- table: group_members
  path: [policies, tenant_isolation]
  reason: >-
