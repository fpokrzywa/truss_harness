- table: model_providers
  path: [policies, tenant_isolation]
  reason: "the SHI-wide model provider and its models are shared rows (tenant NULL) every client reads and only the platform administrator context writes (design 3 and 5.3, DECISIONS B-1701, B-1702): replaced by read_global_or_own and write_own, as egress_policies (B-1501)."
  migration: models_admin_0001

- table: model_providers
  path: [policies, read_global_or_own]
  reason: "the SHI-wide model provider and its models are shared rows (tenant NULL) every client reads and only the platform administrator context writes (design 3 and 5.3, DECISIONS B-1701, B-1702): SELECT own rows and the shared row."
  migration: models_admin_0001

- table: model_providers
  path: [policies, write_own]
  reason: "the SHI-wide model provider and its models are shared rows (tenant NULL) every client reads and only the platform administrator context writes (design 3 and 5.3, DECISIONS B-1701, B-1702): writes need the client's own rows, or tenant NULL together with the platform administrator context."
  migration: models_admin_0001

