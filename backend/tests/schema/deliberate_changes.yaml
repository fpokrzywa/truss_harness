    Groups are platform-level since identity_0005 (design 5.3, DECISIONS B-928): a SHI-wide group exists once and reaches a client only through role bindings stored in that client; the composite (tenant_id, id) key existed only for SETH's client-keyed group_members foreign key.
  migration: identity_0005

- table: groups
  path: [indexes, uq_groups__tenant_id_id]
