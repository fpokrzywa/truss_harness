    A staff member reads their own membership rows with no client context only (exact-text REVIEWED_EXPRESSIONS entry, not a PRINCIPAL_TABLES entry: a membership is a grant, B-928, B-936); the PDP reads memberships through shifde_active_group_ids(uuid), limited to groups bound in the current client (B-929).
