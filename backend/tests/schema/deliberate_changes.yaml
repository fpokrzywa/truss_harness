# models_admin_0001: the SHI-wide provider (DECISIONS B-1701..B-1703)
- table: model_providers
  path: [columns, tenant_id, nullable]
  reason: "the SHI-wide model provider and its models are shared rows (tenant NULL) every client reads and only the platform administrator context writes (design 3 and 5.3, DECISIONS B-1701, B-1702): tenant_id NULL marks the one SHI provider; ck_model_providers__platform pins it to SHI_PROVIDER_ID."
  migration: models_admin_0001

- table: model_providers
  path: [columns, connection_id, nullable]
  reason: "the SHI-wide model provider and its models are shared rows (tenant NULL) every client reads and only the platform administrator context writes (design 3 and 5.3, DECISIONS B-1701, B-1702): the SHI provider uses no client connection; ck_model_providers__platform makes connection_id NULL exactly on the shared row, so every client provider still names its own connection through fk_model_providers__connection."
  migration: models_admin_0001

