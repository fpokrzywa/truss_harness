# Reviewed differences between this database and SETH 3ba0e06 for ported tables
# (tests/schema/test_schema_vs_seth.py). Each entry:
#
#   - table: <table name in schema shifde>
#     path: [<section>, <key>, ...]   # inside the table's snapshot, see tests/schema/snapshot.py;
#                                     # section is one of columns, constraints, indexes, triggers,
#                                     # rls, policies, privileges
#     reason: <why the new schema differs>
#     migration: <revision id that makes the change>
#
# An entry whose path does not actually differ from SETH fails the test (remove it).


- table: budget_reservations
  path: [constraints, fk_budget_reservations__run]
  reason: "foreign key to shifde.runs, a table of the runtime module that is not ported yet; the runtime migration adds it (docs/build/carry_forward.md)"
  migration: ledger_0001

- table: usage_events
  path: [constraints, usage_events_cost_kind_check]
  reason: "cost_kind admits 'estimated': a cost priced from token counts the platform estimated because the provider reported none (findings Item 11, DECISIONS B-602); SETH stored such usage as 0 tokens labelled calculated"
  migration: ledger_0001
- table: budgets
  path: [constraints, uq_budgets__tenant_id]
  reason: "constraints bypass row-level security: a budget_alerts row naming another client's budget id was accepted (or collided with that client's slot, silencing its alert under ON CONFLICT DO NOTHING). Isolation review 1, item 2, B-607. Target of the composite foreign key from budget_alerts."
  migration: ledger_0001

- table: budgets
  path: [indexes, uq_budgets__tenant_id]
  reason: "constraints bypass row-level security: a budget_alerts row naming another client's budget id was accepted (or collided with that client's slot, silencing its alert under ON CONFLICT DO NOTHING). Isolation review 1, item 2, B-607. Index of uq_budgets__tenant_id."
  migration: ledger_0001

- table: budget_alerts
  path: [constraints, budget_alerts_budget_id_fkey, definition]
  reason: "constraints bypass row-level security: a budget_alerts row naming another client's budget id was accepted (or collided with that client's slot, silencing its alert under ON CONFLICT DO NOTHING). Isolation review 1, item 2, B-607. The foreign key is (tenant_id, budget_id) to budgets (tenant_id, id)."
  migration: ledger_0001

- table: budget_alerts
  path: [constraints, uq_budget_alerts__once, definition]
  reason: "constraints bypass row-level security: a budget_alerts row naming another client's budget id was accepted (or collided with that client's slot, silencing its alert under ON CONFLICT DO NOTHING). Isolation review 1, item 2, B-607. The once-only slot is per tenant: (tenant_id, budget_id, period_start, threshold)."
  migration: ledger_0001

- table: budget_alerts
  path: [indexes, uq_budget_alerts__once]
  reason: "constraints bypass row-level security: a budget_alerts row naming another client's budget id was accepted (or collided with that client's slot, silencing its alert under ON CONFLICT DO NOTHING). Isolation review 1, item 2, B-607. Index of uq_budget_alerts__once."
  migration: ledger_0001

- table: usage_events
  path: [triggers, trg_usage_events_version_scope]
  reason: "the foreign key to rate_card_versions accepts (and so confirms) another client's version id; this trigger requires a global version or one of the event's own tenant. Isolation review 1, item 3, B-608."
  migration: ledger_0001

- table: audit_events
  path: [policies, write_own]
  reason: "ARCH m7 (B-701): SETH's INSERT check admitted tenant_id NULL for any caller; a NULL-tenant row now needs the platform-administrator context"
  migration: audit_0001
- table: role_permissions
  path: [constraints, ck_role_permissions__no_platform_only_in_client_role]
  reason: >-
    A client role (tenant_id NOT NULL) cannot hold a platform-only permission (platform:admin): it comes only from users.is_platform_admin, never from a role. SETH let a client put it into its own role and the PDP then reported it from effective_permissions / missing_permissions / visible_scopes. Authz isolation review 1, follow-up 1; DECISIONS B-406. System templates (tenant_id NULL) are unaffected.
  migration: authz_0002

- table: secrets
  path: [constraints, uq_secrets__tenant_id_id]
  reason: "constraints bypass row-level security: SETH's plain secret_access_log_secret_id_fkey accepted a client's access-log row naming another client's secret id (B-116 item 9, B-801). Target of the composite foreign key from secret_access_log."
  migration: secrets_0001

- table: secrets
  path: [indexes, uq_secrets__tenant_id_id]
  reason: "constraints bypass row-level security (B-116 item 9, B-801). Index of uq_secrets__tenant_id_id."
  migration: secrets_0001

- table: secret_access_log
  path: [constraints, fk_secret_access_log__secret]
  reason: "constraints bypass row-level security: an access-log row must name a secret of its own tenant, (tenant_id, secret_id) -> secrets (tenant_id, id) (B-116 item 9, B-801). SETH's plain secret_access_log_secret_id_fkey is kept for installation-level rows (tenant_id NULL), which the composite key does not check."
  migration: secrets_0001

- table: users
  path: [policies, users_insert, with_check]
  reason: >-
    SETH's `OR shifde.current_tenant_id() IS NOT NULL` let any client context create a platform-wide staff account (users exist once and reach clients through bindings, design 5.3): a client could squat a colleague's e-mail and later be handed access elsewhere. The rejected form (B-112) is replaced by the platform-administrator flag; a person still creates only themself (JIT sign-in). DECISIONS B-901.
  migration: identity_0001

- table: setup_tokens
  path: [policies, no_app_access]
  reason: >-
    SETH has no policy on setup_tokens (default deny: no app grants, owner and SECURITY DEFINER functions only). The RLS schema test requires a policy, so the same default deny is stated as a RESTRICTIVE USING (false) WITH CHECK (false) policy. DECISIONS B-902.
  migration: identity_0001

- table: api_keys
  path: [constraints, api_keys_rotated_from_id_fkey]
  reason: >-
    replaced by the composite fk_api_keys__rotated_from: constraints bypass row-level security, and SETH's plain key let a client's key name another client's key as its predecessor (B-116 item 9). tenant_id is NOT NULL, so the composite key checks every row. DECISIONS B-903.
  migration: identity_0001

- table: api_keys
  path: [constraints, fk_api_keys__rotated_from]
  reason: >-
    constraints bypass row-level security: a rotated key's predecessor must be a key of the same client, (tenant_id, rotated_from_id) -> api_keys (tenant_id, id) (B-116 item 9). DECISIONS B-903.
  migration: identity_0001

- table: api_keys
  path: [constraints, uq_api_keys__tenant_id_id]
  reason: >-
    target of the composite fk_api_keys__rotated_from (B-116 item 9). DECISIONS B-903.
  migration: identity_0001

- table: api_keys
  path: [indexes, uq_api_keys__tenant_id_id]
  reason: >-
    index of uq_api_keys__tenant_id_id (B-116 item 9). DECISIONS B-903.
  migration: identity_0001

- table: idp_configs
  path: [constraints, fk_idp_configs__client_secret]
  reason: >-
    constraints bypass row-level security: a client's IdP configuration must name a secret of the same client, (tenant_id, client_secret_ref_id) -> secrets (tenant_id, id) (B-116 item 9). SETH's plain idp_configs_client_secret_ref_id_fkey is kept for installation IdPs (tenant_id NULL), which the composite key does not check. DECISIONS B-903.
  migration: identity_0001

- table: memberships
  path: [policies, insert_by_platform_admin]
  reason: >-
    Identity review 1 item 1 (MUST): SETH let any client context insert a membership for any person (tenant_isolation only), after which users_select showed that client the person's e-mail and the invitation definer trusted the row. The RESTRICTIVE INSERT policy admits a membership only under the platform-administrator context. DECISIONS B-910.
  migration: identity_0002

- table: oidc_auth_requests
  path: [policies, definer_only]
  reason: >-
    Identity review 3 item 5: SETH set the client context from the IdP named in the unauthenticated login and callback paths to write and consume flow state. The RESTRICTIVE policy (USING false, WITH CHECK false) keeps the application role off the table; flow state is written and consumed only by shifde_begin_oidc_request / shifde_consume_oidc_request, which take the client from the IdP row. DECISIONS B-922.
  migration: identity_0004

- table: user_identities
  path: [policies, insert_by_definer_only]
  reason: >-
    Identity review 1 item 2 (MUST): SETH let a person insert an identity for themself at any IdP and subject (own_row and a plain key to idp_configs), so anyone could bind another person's subject at another client's or the installation IdP (lockout or sign-in into the wrong account). The RESTRICTIVE INSERT policy refuses every direct insert; identities are created only by shifde_resolve_identity (setup-token link) and shifde_jit_create_user. DECISIONS B-923.
  migration: identity_0004

- table: idp_configs
  path: [triggers, trg_idp_configs_secret_scope]
  reason: >-
    Identity review 1 item 7: the composite key ties a client's IdP to that client's secrets, but an installation IdP (tenant_id NULL) is checked only by the plain key and could name a client's secret. The trigger refuses an installation IdP whose client secret is not an installation secret. DECISIONS B-924.
  migration: identity_0004

- table: groups
  path: [columns, tenant_id]
  reason: >-
    Groups are platform-level since identity_0005 (design 5.3, DECISIONS B-928): a SHI-wide group exists once and reaches a client only through role bindings stored in that client; SETH keyed every group to one client. Also replaces the deferred groups_tenant_id_fkey (no column, no key).
  migration: identity_0005

