[project]
name = "shifde-backend"
version = "0.9.0"
description = "SHIFDE control-plane backend"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.7",
  "argon2-cffi>=23.1",
  "structlog>=24.4",
  "typer>=0.15",
  "httpx>=0.28.1",
  "cryptography>=50.0.2",
  "joserfc>=1.8.0",
  "mcp>=1.12,<2",
  "jsonschema>=4.26.0",
  "pyyaml>=6.0",
]

[project.scripts]
shifde-api = "shifde.main:run"
shifde-worker = "shifde.worker_main:run"
shifde-admin = "shifde.cli.main:app"
shifde-executor = "shifde.executor.main:run"
# the "shifde.adapters" entry points below came back with the adapters port.

[project.entry-points."shifde.adapters"]
rest_http = "shifde.adapters.rest_http:RestHttpAdapter"
mcp_http = "shifde.adapters.mcp_http:McpHttpAdapter"
postgres = "shifde.adapters.postgres:PostgresAdapter"
fake = "shifde.adapters.model_providers:FakeProvider"
openai_compatible = "shifde.adapters.model_providers:OpenAICompatibleProvider"
anthropic = "shifde.adapters.model_providers:AnthropicProvider"
databricks = "shifde.adapters.dataplatforms.databricks:DatabricksAdapter"
snowflake = "shifde.adapters.dataplatforms.snowflake:SnowflakeAdapter"
fabric = "shifde.adapters.planned:FabricPlanned"

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "types-jsonschema>=4.26.0.20261006",
  "types-pyyaml>=6.0",
  "pytest-xdist>=3.6",
  "filelock>=3.16",
  "bandit==1.9.4",
  "pytest-cov>=7.1.0",
  "flask==3.1.3",
  "databricks-sdk==0.163.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shifde"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# The Fabric notebook template is the FDE SDK file byte for byte: never lint or reformat it.
extend-exclude = ["src/shifde/adapters/native/fabric/templates/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]
"tests/**" = ["E501"]  # long SQL / assertion literals; ruff format still applies

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["migrations/"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# pytest's default norecursedirs minus "build": the default skips any directory named
# build, which silently dropped tests/build from full runs (B-1914).
norecursedirs = ["*.egg", ".*", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"]
addopts = "-ra"
markers = [
    "live: runs against a real Databricks development workspace, a real Snowflake development account or a real Entra tenant (opt-in, see docs/runbooks/databricks-live-validation.md, docs/runbooks/snowflake-live-validation.md and docs/runbooks/entra-live-validation.md)",
    "docker: opt-in local Docker daemon harness (SHIFDE_TEST_DOCKER=1); never validation, never in checks or CI",
]

# Line coverage of the shifde package; CI runs the full suite with `--cov` (F-17).
[tool.coverage.run]
source = ["shifde"]

[tool.coverage.report]
# measured 2026-11-18 on factory/013-f-17-sast-coverage: TOTAL 92.65% (24223/26144 lines), with
# `cd backend; uv run pytest -n 8 --cov --cov-report=term`, rounded down (DECISIONS B-2623)
fail_under = 92

# ---------------------------------------------------------------------------
# Module boundaries (NFR-MAINT-001). Dependency direction per SYSTEM_ARCHITECTURE §5:
#   api -> service -> repository -> models ; cross-module calls go through the other
#   module's service; core depends on nothing.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "shifde"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Modules are layered (higher may import lower, never the reverse)"
type = "layers"
layers = [
  "shifde.main | shifde.executor | shifde.worker_main",
  "shifde.app | shifde.cli",
  "shifde.mcp_access",
  "shifde.assist",
  "shifde.board",
  "shifde.delivery",
  "shifde.appgen",
  "shifde.evaluation",
  "shifde.packaging",
  "shifde.runtime",
  "shifde.ontology",
  "shifde.build",
  "shifde.governance",
  "shifde.admin | shifde.models_admin",
  "shifde.connections",
  "shifde.vendors",
  "shifde.installation",
  "shifde.tenancy",
  "shifde.identity",
  "shifde.secrets",
  "shifde.audit | shifde.authz | shifde.observability | shifde.ledger",
  "shifde.adapters",
  "shifde.core",
]

[[tool.importlinter.contracts]]
name = "Within a module: api -> service -> repository -> models"
type = "layers"
layers = ["(api)", "(service)", "(repository)", "(models)"]
containers = [
  "shifde.tenancy",
  "shifde.identity",
  "shifde.authz",
  "shifde.audit",
  "shifde.secrets",
  "shifde.vendors",
  "shifde.connections",
  "shifde.models_admin",
  "shifde.build",
  "shifde.ontology",
  "shifde.runtime",
  "shifde.governance",
  "shifde.delivery",
  "shifde.evaluation",
  "shifde.packaging",
  "shifde.appgen",
  "shifde.board",
  "shifde.assist",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Core depends on nothing inside shifde"
type = "forbidden"
source_modules = ["shifde.core"]
forbidden_modules = [
  "shifde.tenancy", "shifde.identity", "shifde.authz", "shifde.audit",
  "shifde.observability", "shifde.app", "shifde.cli", "shifde.main",
  "shifde.adapters", "shifde.vendors", "shifde.connections", "shifde.models_admin",
  "shifde.build", "shifde.ontology", "shifde.runtime", "shifde.governance", "shifde.ledger",
  "shifde.evaluation", "shifde.packaging", "shifde.appgen", "shifde.worker_main",
  "shifde.board", "shifde.assist",
]

[[tool.importlinter.contracts]]
name = "The executor never reaches the database (adapters.native)"
type = "forbidden"
# shifde.executor has its own contract below with the same list (minus itself); import-linter
# refuses a module that is both a source and a forbidden module of one contract.
source_modules = ["shifde.adapters.native"]
forbidden_modules = [
  "sqlalchemy", "psycopg", "alembic", "shifde.core.db", "shifde.delivery", "shifde.executor",
  "shifde.main", "shifde.app", "shifde.cli", "shifde.runtime", "shifde.ontology", "shifde.build",
  "shifde.governance", "shifde.admin", "shifde.models_admin", "shifde.connections",
  "shifde.vendors", "shifde.installation", "shifde.tenancy", "shifde.identity", "shifde.secrets",
  "shifde.audit", "shifde.authz", "shifde.observability", "shifde.ledger", "shifde.evaluation",
  "shifde.packaging", "shifde.appgen", "shifde.worker_main",
  "shifde.board", "shifde.assist",
]

[[tool.importlinter.contracts]]
name = "The executor never reaches the database (shifde.executor)"
type = "forbidden"
source_modules = ["shifde.executor"]
forbidden_modules = [
  "sqlalchemy", "psycopg", "alembic", "shifde.core.db", "shifde.delivery",
  "shifde.main", "shifde.app", "shifde.cli", "shifde.runtime", "shifde.ontology", "shifde.build",
  "shifde.governance", "shifde.admin", "shifde.models_admin", "shifde.connections",
  "shifde.vendors", "shifde.installation", "shifde.tenancy", "shifde.identity", "shifde.secrets",
  "shifde.audit", "shifde.authz", "shifde.observability", "shifde.ledger", "shifde.evaluation",
  "shifde.packaging", "shifde.appgen", "shifde.worker_main",
  "shifde.board", "shifde.assist",
]

[[tool.importlinter.contracts]]
name = "appgen.render is pure"
type = "forbidden"
source_modules = ["shifde.appgen.render"]
forbidden_modules = [
  "sqlalchemy", "psycopg", "httpx", "shifde.core.db", "shifde.build", "shifde.connections",
  "shifde.models_admin", "shifde.packaging", "shifde.evaluation", "shifde.runtime",
  "shifde.appgen.service", "shifde.appgen.repository",
]

[[tool.importlinter.contracts]]
name = "SETH never imports the generated app's libraries"
type = "forbidden"
# flask and databricks-sdk are dev-only pins for the generated app's tests (SP5 design R32)
source_modules = ["shifde"]
forbidden_modules = ["flask", "databricks"]

[[tool.importlinter.contracts]]
name = "Only API layers and the app factory may import FastAPI routing; services stay HTTP-free"
type = "forbidden"
source_modules = [
  "shifde.tenancy.service", "shifde.tenancy.repository",
  "shifde.identity.service", "shifde.identity.repository",
  "shifde.authz.service", "shifde.authz.repository", "shifde.authz.pdp",
  "shifde.audit.service", "shifde.audit.repository",
  "shifde.secrets.service", "shifde.secrets.repository",
  "shifde.identity.apikeys", "shifde.identity.oidc", "shifde.authz.execution",
  "shifde.admin.iam", "shifde.admin.credentials", "shifde.admin.providers",
  "shifde.vendors.service", "shifde.vendors.repository",
  "shifde.installation.service", "shifde.installation.profile", "shifde.core.configtools",
  "shifde.connections.service", "shifde.connections.repository", "shifde.connections.egress",
  "shifde.models_admin.service", "shifde.models_admin.repository", "shifde.models_admin.limiter",
  "shifde.build.service", "shifde.build.repository", "shifde.build.kind_ops",
  "shifde.build.tool_runtime", "shifde.build.catalog", "shifde.build.prompts",
  "shifde.build.tools", "shifde.build.skills", "shifde.build.agents",
  "shifde.build.orchestrations", "shifde.core.safeexpr", "shifde.core.bodies",
  "shifde.build.pipelines", "shifde.build.pipeline_nodes", "shifde.core.cron",
  "shifde.runtime.pipeline", "shifde.runtime.pipeline_ops", "shifde.runtime.settle",
  "shifde.runtime.schedules",
  "shifde.runtime.service", "shifde.runtime.repository",
  "shifde.runtime.agent", "shifde.runtime.graph", "shifde.runtime.steps", "shifde.runtime.gate",
  "shifde.runtime.lifecycle", "shifde.runtime.worker", "shifde.runtime.governance",
  "shifde.runtime.context", "shifde.runtime.state", "shifde.runtime.ontology_exec",
  "shifde.runtime.action", "shifde.build.ontologies", "shifde.build.ontology_expr",
  "shifde.build.internal_functions", "shifde.runtime.internal_tools",
  "shifde.build.ontology_ops", "shifde.ontology.service", "shifde.ontology.repository",
  "shifde.ontology.engine", "shifde.ontology.policy",
  "shifde.adapters.base", "shifde.adapters.rest_http", "shifde.adapters.oauth2",
  "shifde.adapters.mcp_http",
  "shifde.adapters.postgres", "shifde.adapters.model_providers", "shifde.adapters.registry",
  "shifde.adapters.evidence", "shifde.adapters.maturity", "shifde.adapters.conformance",
  "shifde.adapters.dataplatforms.sqlapi", "shifde.adapters.dataplatforms.databricks",
  "shifde.adapters.dataplatforms.snowflake",
  "shifde.core.egress", "shifde.core.ssrf",
  "shifde.governance.service", "shifde.governance.repository", "shifde.governance.validation",
  "shifde.ledger.pricing", "shifde.ledger.usage", "shifde.ledger.budgeting",
  "shifde.ledger.enforcement",
  "shifde.runtime.policies", "shifde.observability.tracing", "shifde.observability.metrics",
  "shifde.delivery.service", "shifde.delivery.repository", "shifde.delivery.gateway",
  "shifde.delivery.plans",
  "shifde.packaging.service", "shifde.packaging.repository", "shifde.packaging.schemas",
  "shifde.packaging.canonical",
  "shifde.evaluation.service", "shifde.evaluation.repository", "shifde.evaluation.schemas",
  "shifde.evaluation.assertions", "shifde.evaluation.scoring",
  "shifde.appgen.service", "shifde.appgen.repository", "shifde.appgen.schemas",
  "shifde.appgen.draft", "shifde.appgen.sqlcheck", "shifde.appgen.render",
  "shifde.board.service", "shifde.board.repository", "shifde.board.schemas",
  "shifde.assist.service", "shifde.assist.repository", "shifde.assist.schemas",
  "shifde.assist.catalog", "shifde.assist.routing", "shifde.assist.tools",
]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "MCP tools call services, never a repository (SP8 design 3.1)"
type = "forbidden"
source_modules = ["shifde.mcp_access"]
forbidden_modules = [
  "shifde.secrets.repository", "shifde.identity.repository", "shifde.tenancy.repository",
  "shifde.authz.repository", "shifde.audit.repository", "shifde.vendors.repository",
  "shifde.connections.repository", "shifde.models_admin.repository", "shifde.build.repository",
  "shifde.ontology.repository", "shifde.runtime.repository", "shifde.governance.repository",
  "shifde.delivery.repository", "shifde.packaging.repository", "shifde.evaluation.repository",
  "shifde.board.repository",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The Snowflake JWT helper is pure (shifde.adapters.snowflake_jwt)"
type = "forbidden"
source_modules = ["shifde.adapters.snowflake_jwt"]
forbidden_modules = [
  "httpx", "sqlalchemy", "psycopg", "shifde.core", "shifde.adapters.base",
  "shifde.adapters.oauth2", "shifde.adapters.dataplatforms", "shifde.adapters.native",
]

[[tool.importlinter.contracts]]
name = "Repositories/models are private to their module (cross-module calls use service)"
type = "forbidden"
source_modules = [
  "shifde.tenancy", "shifde.identity", "shifde.audit", "shifde.observability",
  "shifde.secrets", "shifde.admin", "shifde.vendors", "shifde.connections",
  "shifde.models_admin", "shifde.build", "shifde.ontology", "shifde.runtime",
  "shifde.governance", "shifde.ledger",
  "shifde.delivery", "shifde.packaging", "shifde.evaluation",
  "shifde.board",
]
forbidden_modules = [
  "shifde.secrets.repository", "shifde.secrets.models",
  "shifde.identity.repository", "shifde.identity.models",
  "shifde.tenancy.repository", "shifde.tenancy.models",
  "shifde.authz.repository", "shifde.authz.models",
  "shifde.audit.repository", "shifde.audit.models",
  "shifde.vendors.repository", "shifde.connections.repository", "shifde.models_admin.repository",
  "shifde.build.repository", "shifde.ontology.repository", "shifde.governance.repository",
  "shifde.delivery.repository", "shifde.packaging.repository", "shifde.evaluation.repository",
  "shifde.board.repository",
]
allow_indirect_imports = true
ignore_imports = [
  "shifde.identity.** -> shifde.identity.repository",
  "shifde.identity.** -> shifde.identity.models",
  "shifde.tenancy.** -> shifde.tenancy.repository",
  "shifde.tenancy.** -> shifde.tenancy.models",
  "shifde.audit.** -> shifde.audit.repository",
  "shifde.audit.** -> shifde.audit.models",
  "shifde.secrets.** -> shifde.secrets.repository",
  "shifde.secrets.** -> shifde.secrets.models",
  "shifde.vendors.** -> shifde.vendors.repository",
  "shifde.connections.** -> shifde.connections.repository",
  "shifde.models_admin.** -> shifde.models_admin.repository",
  "shifde.build.** -> shifde.build.repository",
  "shifde.ontology.** -> shifde.ontology.repository",
  "shifde.runtime.** -> shifde.runtime.repository",
  "shifde.governance.** -> shifde.governance.repository",
  "shifde.delivery.** -> shifde.delivery.repository",
  "shifde.packaging.** -> shifde.packaging.repository",
  "shifde.evaluation.** -> shifde.evaluation.repository",
  "shifde.board.** -> shifde.board.repository",
]

[[tool.importlinter.contracts]]
name = "Board writes nothing"
type = "forbidden"
# design 2026-11-23 section 3: the board reads other modules' tables through its own repository
# only, writes no audit row and never runs the plan or deployment settle steps (their list/get
# commit); the services it may use import audit.service themselves, hence indirect imports.
source_modules = ["shifde.board"]
forbidden_modules = [
  "shifde.audit.service", "shifde.delivery.plans", "shifde.delivery.deployments",
  "shifde.tenancy.repository", "shifde.tenancy.models",
  "shifde.identity.repository", "shifde.identity.models",
  "shifde.authz.repository", "shifde.authz.models",
  "shifde.audit.repository", "shifde.audit.models",
  "shifde.secrets.repository", "shifde.secrets.models",
  "shifde.vendors.repository", "shifde.connections.repository", "shifde.models_admin.repository",
  "shifde.build.repository", "shifde.ontology.repository", "shifde.runtime.repository",
  "shifde.governance.repository", "shifde.delivery.repository", "shifde.packaging.repository",
  "shifde.evaluation.repository",
]
allow_indirect_imports = true
