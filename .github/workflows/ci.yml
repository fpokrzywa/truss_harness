# Continuous integration: the gate set from docs/build/CHARTER.md section 5.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Secret scan
        run: python -I scripts/validate/scan-secrets.py

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Script tests
        run: python -m unittest discover -s scripts/tests

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # Ephemeral per-run container reachable only from this job.
          POSTGRES_PASSWORD: pg-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      UV_LINK_MODE: copy
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: pg-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install Python 3.13 and dependencies
        run: |
          uv python install 3.13
          uv sync --frozen
      - name: Create database roles and write the dev env
        working-directory: .
        run: |
          owner_pw="$(openssl rand -hex 24)"
          app_pw="$(openssl rand -hex 24)"
          echo "::add-mask::$owner_pw"
          echo "::add-mask::$app_pw"
          psql -v ON_ERROR_STOP=1 -d postgres <<SQL
          CREATE ROLE shifde_owner LOGIN NOSUPERUSER BYPASSRLS CREATEROLE NOCREATEDB PASSWORD '$owner_pw';
          CREATE ROLE shifde_app LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE PASSWORD '$app_pw';
          SQL
          base="127.0.0.1:5432"
          mkdir -p .devdata
          {
            echo "SHIFDE_DATABASE_URL=postgresql+psycopg://shifde_app:${app_pw}@${base}/shifde"
            echo "SHIFDE_MIGRATION_DATABASE_URL=postgresql+psycopg://shifde_owner:${owner_pw}@${base}/shifde"
            echo "SHIFDE_TEST_DATABASE_URL=postgresql+psycopg://shifde_app:${app_pw}@${base}/shifde_test"
            echo "SHIFDE_TEST_MIGRATION_DATABASE_URL=postgresql+psycopg://shifde_owner:${owner_pw}@${base}/shifde_test"
            echo "SHIFDE_TEST_ADMIN_DATABASE_URL=postgresql+psycopg://postgres:${PGPASSWORD}@${base}/postgres"
          } > .devdata/dev.env
      - name: ruff format
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy src
      - name: import-linter
        run: uv run lint-imports
      - name: pytest
        run: uv run pytest -n auto

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
