# SETH edge (SP4 design section 5, call 2): terminates TLS, sends /api/* straight to shifde-api
# and everything else to Next, and overwrites X-Forwarded-For with the real client address.
# Install as /etc/nginx/sites-available/seth.conf and link it into sites-enabled.
# Replace <domain> (owner to confirm).
#
# No add_header here: the security headers and HSTS stay with the app (the API sets them, Next
# sets its CSP), so the edge never duplicates or weakens them.
#
# Upstreams are 127.0.0.1, not localhost: the API's TCP peer must be the trusted 127.0.0.1/32
# (SHIFDE_TRUSTED_PROXIES), and the ports equal SHIFDE_API_PORT and SHIFDE_WEB_PORT.

server {
    listen 80;
    listen [::]:80;
    server_name <domain>;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    # `listen ... http2` (not `http2 on;`, nginx 1.25.1+): Ubuntu 24.04 ships nginx 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <domain>;
    server_tokens off;

    # Certificate source: owner to confirm (an internal CA, a purchased certificate or certbot).
    ssl_certificate /etc/ssl/seth/fullchain.pem;
    ssl_certificate_key /etc/ssl/seth/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The API's default body cap (SHIFDE_MAX_REQUEST_BODY_BYTES, 8 MiB).
    client_max_body_size 8m;

    # Above SHIFDE_MODEL_CALL_DEADLINE_SECONDS (default 120).
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # Never public: a metrics scraper calls the API on loopback with SHIFDE_METRICS_TOKEN.
    location ~ ^/api/metrics(/|$) {
        return 404;
    }

    # No URI part on proxy_pass: the request URI passes unchanged.
    location = /api {
        proxy_pass http://127.0.0.1:8710;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8710;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3710;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
